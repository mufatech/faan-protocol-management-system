{% extends "admin/base.html" %}

{% block content %}

<div class="container-fluid px-4">

    <h1 class="mt-4">Edit Service Level</h1>

    <div class="card mb-4">

        <div class="card-header">

            <i class="fas fa-edit me-1"></i>
            Edit Service Level

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Service Name
                    </label>

                    <input type="text"
                           name="service_name"
                           class="form-control"
                           value="{{ service_level.service_name }}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea name="description"
                              class="form-control"
                              rows="4">{{ service_level.description or '' }}</textarea>

                </div>


                <button type="submit"
                        class="btn btn-success">

                    <i class="fas fa-save"></i>
                    Update Service Level

                </button>


                <a href="{{ url_for(
                    'view_service_level',
                    id=service_level.id
                ) }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
