{% extends "admin/base.html" %}

{% block content %}

<div class="container-fluid px-4">

    <h1 class="mt-4">Edit Passenger</h1>

    <div class="card mb-4">

        <div class="card-header">
            <i class="fas fa-user-edit me-1"></i>
            Edit Passenger Information
        </div>

        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">


                <!-- Passenger Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Passenger Name
                    </label>

                    <input type="text"
                           name="passenger_name"
                           class="form-control"
                           value="{{ passenger.passenger_name }}"
                           required>

                </div>


                <!-- Travel Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Travel Date
                    </label>

                    <input type="date"
                           name="travel_date"
                           class="form-control"
                           value="{{ passenger.travel_date }}"
                           required>

                </div>


                <!-- Organization -->

                <div class="mb-3">

                    <label class="form-label">
                        Organization
                    </label>

                    <select name="organization_id"
                            class="form-select"
                            required>

                        {% for o in organizations %}

                            <option value="{{ o.id }}"
                                {% if o.id == passenger.organization_id %}
                                    selected
                                {% endif %}>

                                {{ o.organization_name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Service Level -->

                <div class="mb-3">

                    <label class="form-label">
                        Service Level
                    </label>

                    <select name="service_level_id"
                            class="form-select"
                            required>

                        {% for s in service_levels %}

                            <option value="{{ s.id }}"
                                {% if s.id == passenger.service_level_id %}
                                    selected
                                {% endif %}>

                                {{ s.service_name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Flight -->

                <div class="mb-3">

                    <label class="form-label">
                        Flight
                    </label>

                    <input type="text"
                           name="flight"
                           class="form-control"
                           value="{{ passenger.flight }}"
                           required>

                </div>


                <!-- Position -->

                <div class="mb-3">

                    <label class="form-label">
                        Position
                    </label>

                    <input type="text"
                           name="position"
                           class="form-control"
                           value="{{ passenger.position or '' }}">

                </div>


                <!-- Itinerary -->

                <div class="mb-3">

                    <label class="form-label">
                        Itinerary
                    </label>

                    <select name="itinerary"
                            class="form-select">

                        <option value="">
                            Select Itinerary
                        </option>

                        <option value="arrival"
                            {% if passenger.itinerary == 'arrival' %}
                                selected
                            {% endif %}>
                            Arrival
                        </option>

                        <option value="departure"
                            {% if passenger.itinerary == 'departure' %}
                                selected
                            {% endif %}>
                            Departure
                        </option>

                    </select>

                </div>


                <!-- Special Needs -->

                <div class="mb-3">

                    <label class="form-label">
                        Special Needs
                    </label>

                    <div class="border rounded p-3">

                        {% for n in needs %}

                            <div class="form-check mb-2">

                                <input class="form-check-input"
                                       type="checkbox"
                                       name="special_need"
                                       value="{{ n.id }}"
                                       id="specialNeed{{ n.id }}"

                                       {% if n in passenger.special_needs %}
                                           checked
                                       {% endif %}>

                                <label class="form-check-label"
                                       for="specialNeed{{ n.id }}">

                                    {{ n.need_name }}

                                </label>

                            </div>

                        {% endfor %}

                    </div>

                </div>


                <!-- Additional Request -->

                <div class="mb-3">

                    <label class="form-label">
                        Additional Request
                    </label>

                    <textarea name="additional_request"
                              class="form-control"
                              rows="4">{{ passenger.additional_request or '' }}</textarea>

                </div>


                <!-- Existing Signature -->

                {% if passenger.passenger_signature %}

                    <div class="mb-3">

                        <label class="form-label">
                            Current Passenger Signature
                        </label>

                        <br>

                        <img src="{{ url_for(
                            'static',
                            filename=passenger.passenger_signature.replace('uploads/', '')
                        ) }}"
                        alt="Passenger Signature"
                        style="max-width:300px; max-height:150px;">

                    </div>

                {% endif %}


                <!-- Replace Signature -->

                <div class="mb-3">

                    <label class="form-label">
                        Replace Signature
                    </label>

                    <input type="file"
                           name="passenger_signature"
                           class="form-control"
                           accept="image/*">

                    <small class="text-muted">
                        Leave this empty if you do not want to change the signature.
                    </small>

                </div>


                <!-- Buttons -->

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-success">

                        <i class="fas fa-save"></i>
                        Update Passenger

                    </button>


                    <a href="{{ url_for('view_passenger', id=passenger.id) }}"
                       class="btn btn-secondary">

                        <i class="fas fa-arrow-left"></i>
                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
