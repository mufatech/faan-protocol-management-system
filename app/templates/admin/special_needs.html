{% extends "admin/base.html" %}

{% block content %}

<div class="container-fluid px-4">

    <h1 class="mt-4">Special Needs</h1>

    <div class="card mb-4">

        <!-- CARD HEADER -->
        <div class="card-header">

            <i class="fas fa-wheelchair me-1"></i>
            Special Needs Management

        </div>


        <!-- CARD BODY -->
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <!-- TABLE HEADER -->
                    <thead class="table-success">

                        <tr>

                            <th>S/N</th>
                            <th>Special Need</th>
                            <th>Description</th>
                            <th>Actions</th>

                        </tr>

                    </thead>


                    <!-- TABLE BODY -->
                    <tbody>

                        {% for need in needs %}

                        <tr>

                            <!-- S/N -->
                            <td>
                                {{ loop.index }}
                            </td>


                            <!-- SPECIAL NEED -->
                            <td>
                                {{ need.need_name }}
                            </td>


                            <!-- DESCRIPTION -->
                            <td>
                                {{ need.description or 'N/A' }}
                            </td>


                            <!-- ACTIONS -->
                            <td>

                                <!-- VIEW -->
                                <a href="{{ url_for(
                                    'view_special_need',
                                    id=need.id
                                ) }}"
                                class="btn btn-sm btn-info">

                                    <i class="fas fa-eye"></i>
                                    View

                                </a>


                                <!-- EDIT -->
                                <a href="{{ url_for(
                                    'edit_special_need',
                                    id=need.id
                                ) }}"
                                class="btn btn-sm btn-warning">

                                    <i class="fas fa-edit"></i>
                                    Edit

                                </a>


                                <!-- DELETE -->
                                <form method="POST"
                                      action="{{ url_for(
                                          'delete_special_need',
                                          id=need.id
                                      ) }}"
                                      style="display:inline;">

                                    <button type="submit"
                                            class="btn btn-sm btn-danger"
                                            onclick="return confirm(
                                                'Are you sure you want to delete this Special Need?'
                                            );">

                                        <i class="fas fa-trash"></i>
                                        Delete

                                    </button>

                                </form>

                            </td>

                        </tr>


                        <!-- NO SPECIAL NEEDS -->
                        {% else %}

                        <tr>

                            <td colspan="4"
                                class="text-center">

                                <strong>
                                    No Special Needs found.
                                </strong>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
